{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block scripts %}<script src="{{ url_for('static', path='/js/auth.js') }}" defer></script>{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>로그인</h1>
  <p id="signup-notice" class="notice" role="status" hidden>가입되었습니다.</p>
  <p id="form-error" class="error" role="alert"></p>
  <form id="auth-form" data-mode="login" method="post" action="/api/v1/auth/login">
    <label for="loginId">아이디</label>
    <input id="loginId" name="loginId" autocomplete="username" maxlength="20" required>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="submit-auth" type="submit">로그인</button>
  </form>
  <p>계정이 없으신가요? <a href="/signup">회원가입</a></p>
</section>
{% endblock %}
