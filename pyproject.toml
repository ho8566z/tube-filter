[project]
name = "tube-filter"
version = "0.1.0"
description = "YouTube video filtering service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "bcrypt>=4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2,<3",
    "tzdata>=2026.6",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
